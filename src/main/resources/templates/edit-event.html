<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event</title>

    <link rel="stylesheet" th:href="@{/css/edit-event.css}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <div class="form-header">

            <div class="edit-icon">✏️</div>

            <h1>Edit Event</h1>

            <p>
                Update the event details below.
            </p>

        </div>

        <form action="/admin/events/edit" method="post">

            <!-- Event ID -->

            <input type="hidden"
                   name="id"
                   th:value="${event.id}">

            <!-- Title -->

            <div class="form-group">

                <label for="title">
                    Event Title
                </label>

                <input
                        type="text"
                        id="title"
                        name="title"
                        th:value="${event.title}"
                        placeholder="Enter event title"
                        required>

            </div>

            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Enter event description"
                        required
                        th:text="${event.description}"></textarea>

            </div>

            <!-- Date and Time -->

            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                            type="text"
                            id="date"
                            name="date"
                            th:value="${event.date}"
                            placeholder="10-08-2026"
                            required>

                </div>

                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                            type="text"
                            id="time"
                            name="time"
                            th:value="${event.time}"
                            placeholder="10:00 AM"
                            required>

                </div>

            </div>

            <!-- Location -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                        type="text"
                        id="location"
                        name="location"
                        th:value="${event.location}"
                        placeholder="Enter event location"
                        required>

            </div>

            <!-- Buttons -->

            <div class="form-actions">

                <a href="/admin/dashboard"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="update-btn">
                    Update Event
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
