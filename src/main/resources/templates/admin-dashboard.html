<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

</head>

<body>

<div class="dashboard-container">

    <!-- Header -->

    <header class="dashboard-header">

        <div>
            <h1>Admin Dashboard</h1>
            <p>Manage events and registrations</p>
        </div>

        <div class="header-actions">

            <a href="/admin/events/add" class="add-btn">
                + Add New Event
            </a>

            <a href="/" class="home-btn">
                Home
            </a>

        </div>

    </header>

    <!-- Events Section -->

    <section class="events-section">

        <div class="section-heading">

            <h2>All Events</h2>

            <span th:if="${!#lists.isEmpty(events)}"
                  th:text="${#lists.size(events)} + ' Events'">
            </span>

        </div>

        <!-- No Events -->

        <div class="empty-card"
             th:if="${#lists.isEmpty(events)}">

            <div class="empty-icon">📅</div>

            <h3>No Events Available</h3>

            <p>
                Create your first event to get started.
            </p>

            <a href="/admin/events/add" class="add-btn">
                + Add New Event
            </a>

        </div>

        <!-- Event Cards -->

        <div class="events-grid"
             th:unless="${#lists.isEmpty(events)}">

            <div class="event-card"
                 th:each="event : ${events}">

                <div class="event-card-header">

                    <h3 th:text="${event.title}">
                        Event Title
                    </h3>

                </div>

                <p class="description"
                   th:text="${event.description}">
                    Event description
                </p>

                <div class="event-info">

                    <div class="info-row">

                        <span class="label">
                            📅 Date
                        </span>

                        <span th:text="${event.date}">
                            Date
                        </span>

                    </div>

                    <div class="info-row">

                        <span class="label">
                            ⏰ Time
                        </span>

                        <span th:text="${event.time}">
                            Time
                        </span>

                    </div>

                    <div class="info-row">

                        <span class="label">
                            📍 Location
                        </span>

                        <span th:text="${event.location}">
                            Location
                        </span>

                    </div>

                </div>

                <!-- Actions -->

                <div class="event-actions">

                    <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                       class="edit-btn">
                        Edit
                    </a>

                    <a th:href="@{/admin/events/delete/{id}(id=${event.id})}"
                       class="delete-btn"
                       onclick="return confirm('Are you sure you want to delete this event?')">
                        Delete
                    </a>

                    <a th:href="@{/admin/events/{id}/registrations(id=${event.id})}"
                       class="registration-btn">
                        View Registrations
                    </a>

                </div>

            </div>

        </div>

    </section>

</div>

</body>

</html>
