<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Event</title>

    <link rel="stylesheet" th:href="@{/css/add-event.css}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <div class="form-header">

            <h1>Add New Event</h1>

            <p>
                Create a new event for users to register.
            </p>

        </div>

        <form action="/admin/events/add" method="post">

            <div class="form-group">

                <label for="title">
                    Event Title
                </label>

                <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter event title"
                        required>

            </div>

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                        id="description"
                        name="description"
                        placeholder="Enter event description"
                        rows="5"
                        required></textarea>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                            type="text"
                            id="date"
                            name="date"
                            placeholder="10-08-2026"
                            required>

                </div>

                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                            type="text"
                            id="time"
                            name="time"
                            placeholder="10:00 AM"
                            required>

                </div>

            </div>

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter event location"
                        required>

            </div>

            <div class="form-actions">

                <a href="/admin/dashboard"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="add-btn">
                    Add Event
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
