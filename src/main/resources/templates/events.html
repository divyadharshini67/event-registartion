<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Available Events</title>

    <link rel="stylesheet" th:href="@{/css/events.css}">
</head>

<body>

<div class="events-container">

    <div class="page-header">

        <div>
            <h1>Available Events</h1>
            <p>Explore upcoming events and join the ones you like.</p>
        </div>

        <a href="/dashboard" class="dashboard-btn">
            ← Dashboard
        </a>

    </div>

    <!-- No Events -->

    <div class="empty-message"
         th:if="${#lists.isEmpty(events)}">

        <div class="empty-icon">📅</div>

        <h2>No Events Available</h2>

        <p>
            There are currently no events available.
        </p>

    </div>

    <!-- Events -->

    <div class="events-grid"
         th:unless="${#lists.isEmpty(events)}">

        <div class="event-card"
             th:each="event : ${events}">

            <div class="event-content">

                <h2 th:text="${event.title}">
                    Event Title
                </h2>

                <p class="description"
                   th:text="${event.description}">
                    Event description
                </p>

                <div class="event-info">

                    <p>
                        <strong>📅 Date:</strong>
                        <span th:text="${event.date}"></span>
                    </p>

                    <p>
                        <strong>⏰ Time:</strong>
                        <span th:text="${event.time}"></span>
                    </p>

                    <p>
                        <strong>📍 Location:</strong>
                        <span th:text="${event.location}"></span>
                    </p>

                </div>

                <a class="details-btn"
                   th:href="@{/events/{id}(id=${event.id})}">
                    View Details →
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
